<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Integrity Admin — Tenants</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial;max-width:980px;margin:24px auto;padding:16px}
    h1{font-size:20px;margin-bottom:12px}
    label{display:block;margin-top:10px;font-size:13px;color:#333}
    input[type="text"], input[type="password"], textarea, select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
    textarea{min-height:80px}
    .row{display:flex;gap:8px;margin-top:8px}
    button{padding:10px 14px;border:none;border-radius:6px;background:#0078d4;color:#fff;cursor:pointer}
    button.secondary{background:#6c757d}
    .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
    .note{margin-top:12px;color:#555;font-size:13px}
    pre{background:#f6f8fa;padding:10px;border-radius:6px;overflow:auto}
    .status{margin-top:12px;padding:10px;border-radius:6px;background:#f1f5f9;color:#0b2545}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #e6e9ed;padding:8px;text-align:left}
    th{background:#f7fafc}
  </style>
</head>
<body>
  <h1>Admin: Manage Tenants & API Keys</h1>

  <label>Admin Secret (x-admin-secret header)</label>
  <input id="adminSecret" type="password" placeholder="ADMIN_SECRET (kept secret)" />

  <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
    <button id="refreshBtn">Refresh Tenants</button>
    <button id="newBtn" class="secondary">New Tenant</button>
  </div>

  <div id="tenantsList"></div>

  <hr style="margin:20px 0" />

  <label>Tenant ID</label>
  <input id="tenantId" type="text" placeholder="e.g. acme" />

  <label>Allowed Origins (one per line)</label>
  <textarea id="allowedOrigins" placeholder="https://www.acme.example"></textarea>

  <label>API Key</label>
  <div class="row">
    <input id="apiKey" type="text" readonly placeholder="Generate or paste key" />
    <button id="genBtn">Generate</button>
    <button id="copyBtn" class="secondary">Copy</button>
  </div>

  <div class="actions">
    <button id="saveBtn">Save Tenant</button>
    <button id="deleteBtn" class="secondary">Delete Tenant</button>
  </div>

  <div class="note">
    Notes:
    <ul>
      <li>The page calls POST /admin/tenant/{tenant_id} with header x-admin-secret. Do not expose ADMIN_SECRET publicly.</li>
      <li>Generated keys are strong random values (base64url). You can paste your own instead.</li>
    </ul>
  </div>

  <div id="status" class="status" style="display:none"></div>

  <script>
    function showStatus(text, ok = true) {
      const s = document.getElementById('status');
      s.style.display = 'block';
      s.style.background = ok ? '#e6ffed' : '#ffe6e6';
      s.style.color = ok ? '#064e1a' : '#6b0b0b';
      s.textContent = text;
    }

    function base64UrlFromBytes(bytes) {
      let binary = '';
      const len = bytes.length;
      for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
      let b64 = btoa(binary);
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function fetchTenants() {
      const adminSecret = document.getElementById('adminSecret').value.trim();
      if (!adminSecret) return showStatus('Provide ADMIN secret to list tenants', false);
      try {
        const resp = await fetch('/admin/tenants', { headers: { 'x-admin-secret': adminSecret } });
        if (!resp.ok) {
          const txt = await resp.text();
          return showStatus('Error fetching tenants: ' + txt, false);
        }
        const j = await resp.json();
        renderTenants(j.tenants || []);
        showStatus('Tenants refreshed', true);
      } catch (e) {
        showStatus('Fetch failed: ' + e.message, false);
      }
    }

    function renderTenants(tenants) {
      const container = document.getElementById('tenantsList');
      if (!tenants || tenants.length === 0) {
        container.innerHTML = '<p>No tenants found</p>';
        return;
      }
      let html = '<table><thead><tr><th>Tenant</th><th>API Key</th><th>Allowed Origins</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
      for (const t of tenants) {
        html += `<tr><td>${t.tenant}</td><td><code style="user-select:all">${t.api_key || ''}</code></td><td>${(t.allowed_origins||[]).map(x=>'<div>'+x+'</div>').join('')}</td><td>${t.created_at||''}</td><td><button data-tenant="${t.tenant}" class="editBtn">Edit</button></td></tr>`;
      }
      html += '</tbody></table>';
      container.innerHTML = html;
      for (const b of container.querySelectorAll('.editBtn')) {
        b.addEventListener('click', async (ev) => {
          const tenant = ev.currentTarget.dataset.tenant;
          await loadTenant(tenant);
        });
      }
    }

    async function loadTenant(tenant) {
      const adminSecret = document.getElementById('adminSecret').value.trim();
      if (!adminSecret) return showStatus('Provide ADMIN secret to load tenant', false);
      try {
        const resp = await fetch('/admin/tenant/' + encodeURIComponent(tenant), { headers: { 'x-admin-secret': adminSecret } });
        if (!resp.ok) return showStatus('Could not load tenant: ' + await resp.text(), false);
        const j = await resp.json();
        document.getElementById('tenantId').value = j.tenant || '';
        document.getElementById('apiKey').value = j.api_key || '';
        document.getElementById('allowedOrigins').value = (j.allowed_origins || []).join('\n');
        showStatus('Loaded tenant ' + j.tenant, true);
      } catch (e) {
        showStatus('Load failed: ' + e.message, false);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchTenants);
    document.getElementById('newBtn').addEventListener('click', () => {
      document.getElementById('tenantId').value = '';
      document.getElementById('apiKey').value = '';
      document.getElementById('allowedOrigins').value = '';
      showStatus('Ready for new tenant', true);
    });

    document.getElementById('genBtn').addEventListener('click', () => {
      try {
        const u = new Uint8Array(36);
        crypto.getRandomValues(u);
        const key = base64UrlFromBytes(u);
        document.getElementById('apiKey').value = key;
        showStatus('Generated key. Copy or save it now.', true);
      } catch (e) {
        showStatus('Key generation failed: ' + e.message, false);
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const k = document.getElementById('apiKey').value;
      if (!k) return showStatus('No key to copy', false);
      try {
        await navigator.clipboard.writeText(k);
        showStatus('Key copied to clipboard', true);
      } catch {
        showStatus('Copy failed — select and copy manually', false);
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const tenant = (document.getElementById('tenantId').value || '').trim();
      const apiKey = (document.getElementById('apiKey').value || '').trim();
      const adminSecret = document.getElementById('adminSecret').value || '';
      const allowedText = document.getElementById('allowedOrigins').value || '';
      if (!tenant) return showStatus('Tenant ID is required', false);
      if (!adminSecret) return showStatus('ADMIN secret is required to save', false);
      if (!apiKey) return showStatus('API key is required (generate or paste)', false);

      const lines = allowedText.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
      const payload = { api_key: apiKey, allowed_origins: lines };

      try {
        const resp = await fetch('/admin/tenant/' + encodeURIComponent(tenant), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-secret': adminSecret
          },
          body: JSON.stringify(payload),
          cache: 'no-cache'
        });

        const text = await resp.text();
        if (resp.ok) {
          showStatus('Tenant saved successfully', true);
        } else {
          let detail = text;
          try { const j = JSON.parse(text); detail = j.detail || j.error || text } catch {}
          showStatus('Error saving tenant: ' + detail, false);
        }
      } catch (err) {
        showStatus('Request failed: ' + err.message, false);
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      const tenant = (document.getElementById('tenantId').value || '').trim();
      const adminSecret = document.getElementById('adminSecret').value || '';
      if (!tenant) return showStatus('Tenant ID required to delete', false);
      if (!adminSecret) return showStatus('ADMIN secret required', false);
      if (!confirm('Delete tenant ' + tenant + '? This cannot be undone.')) return;
      try {
        const resp = await fetch('/admin/tenant/' + encodeURIComponent(tenant), {
          method: 'DELETE',
          headers: { 'x-admin-secret': adminSecret }
        });
        if (resp.ok) {
          showStatus('Tenant deleted', true);
          fetchTenants();
        } else {
          showStatus('Delete failed: ' + await resp.text(), false);
        }
      } catch (e) {
        showStatus('Delete failed: ' + e.message, false);
      }
    });

    // auto-refresh if admin secret present
    setTimeout(() => {
      const s = document.getElementById('adminSecret').value || '';
      if (s) fetchTenants();
    }, 500);
  </script>
</body>
</html>
